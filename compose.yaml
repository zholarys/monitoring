name: devops-lab

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lab_root_password
      MYSQL_DATABASE: lab
      MYSQL_USER: labuser
      MYSQL_PASSWORD: lab_password
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:

include:
  - compose.monitoring.yaml
  - compose.logging.yaml
  - compose.node.yaml
  - compose.alerting.yaml
